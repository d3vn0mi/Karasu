# =============================================================================
#  pi_mode.conf  |  Yatagarasu — shared identity (single source of truth)
#
#  Sourced by pi-ap / pi-bridge / pi-intercept / pi-mode (if present at
#  /etc/pi-mode/pi-mode.conf, or via $PI_MODE_CONF). Any value here OVERRIDES the
#  matching default in each script's own CONFIG block; anything not set here
#  falls back to that script's default, so this file is optional.
#
#  'sudo pi-mode install' copies this to /etc/pi-mode/pi-mode.conf (only if absent).
#  Keep it to literal KEY="value" lines — it is sourced by bash under set -u.
# =============================================================================

# --- interface ROLES (edit to match the rig) ---
WLAN_IFACE="wlan0"      # Wi-Fi AP + out-of-band plane
WIRED_IFACE="eth0"      # built-in wired: AP workstation / bridge server / intercept workstation
SECOND_IFACE="usb0"     # 2nd NIC: bridge router side / intercept corporate uplink
MGMT_IFACE="eth2"       # optional out-of-band management cable (bridge/intercept, ENABLE_MGMT=1)

# --- identity ---
PI_HOSTNAME="karasu"    # hostname + mDNS/unicast name (karasu.local, karasu)
UPLOAD_PORT="80"        # updrop HTTP port (80 = portless)

# --- out-of-band management address (used when a mode's ENABLE_MGMT=1) ---
MGMT_IP="10.73.0.1"     # non-overlapping with the AP eth0 net (192.168.160.0/24) on purpose
MGMT_PREFIX="24"

# NOTE: bridge's KARASU_IP is PER-DEPLOYMENT/ephemeral (a free host in the server's
# real subnet) — set it in pi_bridge_setup.sh per engagement, not here.
